  header{position:sticky;top:0;z-index:20;background:rgba(248,244,250,.86);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);}

  .brand{display:flex;align-items:center;gap:11px;}
  .brand .mk{width:42px;height:42px;flex-shrink:0;}
  .brand b{font-size:23px;font-weight:800;letter-spacing:-.5px;}
  .brand .tg{font-size:12px;color:var(--soft);font-weight:600;margin-top:-3px;}
  .gear{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:19px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;}
  /* screens */
  main{padding-top:18px;}
  .screen{display:none;animation:fade .25s ease;}
  .screen.active{display:block;}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  h1.title{font-size:30px;font-weight:800;letter-spacing:-1px;margin-bottom:4px;}
  .eyebrow{font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--violet);}
  .lede{color:var(--soft);font-size:15px;margin-bottom:18px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);margin-bottom:16px;animation:rise .34s cubic-bezier(.2,.7,.3,1) both;}
  .card:nth-of-type(2){animation-delay:.04s}.card:nth-of-type(3){animation-delay:.08s}.card:nth-of-type(4){animation-delay:.12s}.card:nth-of-type(5){animation-delay:.16s}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.card{animation:none}}
  .card h2{font-size:18px;font-weight:700;margin-bottom:4px;}
  .card .csub{font-size:13px;color:var(--soft);margin-bottom:14px;}
  .grad{background:var(--grad);}
  .row{display:flex;gap:12px;}
  .row.wrap{flex-wrap:wrap;}
  .col{flex:1;}
  /* buttons */
  .btn{border:none;border-radius:999px;padding:13px 22px;font-family:inherit;font-weight:600;font-size:15px;cursor:pointer;transition:.15s;}
  .btn-primary{background:var(--grad);color:#fff;box-shadow:0 6px 18px rgba(69,55,95,.30),inset 0 1px 0 rgba(255,255,255,.22);transition:transform .12s,box-shadow .12s;}
  .btn-primary:active{transform:translateY(1px) scale(.99);box-shadow:0 3px 10px rgba(69,55,95,.28)}
  .btn-primary:active{transform:scale(.98);}
  .btn-ghost{background:#fff;border:1.5px solid var(--line);color:var(--ink);}
  .btn-sm{padding:9px 16px;font-size:13px;}
  .btn-block{width:100%;}
  /* pills / toggles */
  .pill{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:#fff;color:var(--ink);
    border-radius:999px;padding:9px 16px;font-size:14px;font-weight:600;transition:transform .1s,box-shadow .15s,background .15s;cursor:pointer;user-select:none;}
  .pill.on{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 5px 14px rgba(69,55,95,.24)}
  .pill-row{display:flex;gap:10px;flex-wrap:wrap;}
  /* symptom sliders */
  .sym{margin:16px 0;}
  .sym .lab{display:flex;justify-content:space-between;font-weight:600;font-size:15px;margin-bottom:8px;}
  .sym .lab .v{color:var(--plum);font-weight:700;}
  .segs{display:flex;gap:7px;}

  .seg.on{background:linear-gradient(135deg,var(--teal),var(--violet));}
  .seg.hi{background:linear-gradient(135deg,var(--berry),var(--plum));}
  .legend{display:flex;justify-content:space-between;font-size:11px;color:var(--soft);margin-top:8px;font-weight:600;}
  /* inputs */
  input,select{font-family:inherit;font-size:15px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);width:100%;}
  input:focus,select:focus{outline:none;border-color:var(--violet);}
  label.fl{font-size:13px;font-weight:600;color:var(--soft);display:block;margin-bottom:6px;}
  .field{margin-bottom:14px;}
  /* stat tiles */
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .tile{background:linear-gradient(180deg,#fff,var(--card));border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 8px 22px rgba(69,55,95,.07)}
  .tile .t{font-size:12px;color:var(--soft);font-weight:600;}
  .tile .b{font-size:26px;font-weight:800;letter-spacing:-.5px;}
  .tile .d{font-size:12px;color:var(--soft);}
  /* dose ring */
  .dose-hero{display:flex;align-items:center;gap:18px;}
  .ring{width:96px;height:96px;flex-shrink:0;}
  /* list items */
  .item{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--line);}
  .item:last-child{border-bottom:none;}
  .item .x{color:var(--berry);cursor:pointer;font-weight:700;font-size:13px;}
  .muted{color:var(--soft);font-size:13px;}
  .note{background:var(--warn-soft);border:1px solid #F1D9B4;border-radius:14px;padding:14px;font-size:13.5px;color:#7A5518;line-height:1.5;}
  .note b{color:#633a12;}
  .good-note{background:#F4E7EE;border:1px solid #E3C9D8;border-radius:14px;padding:14px;font-size:13.5px;color:#5C2F49;}
  .chip-info{display:inline-block;background:#EFE7F3;color:var(--plum);font-weight:600;font-size:12px;padding:5px 12px;border-radius:999px;}
  .disc{font-size:12px;color:var(--soft);line-height:1.5;margin-top:8px;background:#F3EEF6;border-radius:12px;padding:12px 14px;}
  /* checklist */
  .check{display:flex;align-items:center;gap:12px;padding:12px 0;cursor:pointer;border-bottom:1px solid var(--line);}
  .check:last-child{border-bottom:none;}
  .box{width:28px;height:28px;border-radius:9px;border:2px solid var(--line);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff;transition:.15s;}

  .check .cs{font-size:12px;color:var(--soft);}
  /* bottom nav */
  nav.tabs{position:fixed;bottom:12px;left:12px;right:12px;background:rgba(255,252,254,.82);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);
    border:1px solid rgba(94,75,126,.16);border-radius:26px;z-index:30;box-shadow:0 14px 40px rgba(69,55,95,.18),0 2px 6px rgba(69,55,95,.08);}
  .tabs-in{max-width:760px;margin:0 auto;display:flex;justify-content:space-around;padding:8px 6px 12px;}
  .tab{background:none;border:none;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:3px;
    color:var(--soft);font-size:10.5px;font-weight:600;cursor:pointer;padding:5px 8px;border-radius:12px;flex:1;}
  .tab .ic{font-size:21px;line-height:1;}
  .tab.on{color:var(--teal-deep);background:linear-gradient(180deg,rgba(94,75,126,.14),rgba(94,75,126,.07));border-radius:18px;}
  .tab{transition:color .15s,background .15s;border-radius:18px;margin:5px 2px;}
  .tab.on .ic{transform:translateY(-1px);}
  /* mini bars */
  .bars{display:flex;align-items:flex-end;gap:6px;height:70px;}
  .bar{flex:1;background:linear-gradient(180deg,var(--violet),var(--teal));border-radius:6px 6px 0 0;min-height:4px;}
  /* modal */
  .modal-bg{position:fixed;inset:0;background:rgba(53,40,63,.5);z-index:50;display:none;align-items:flex-end;justify-content:center;}
  .modal-bg.on{display:flex;}
  .modal{background:#fff;border-radius:24px 24px 0 0;padding:24px 20px 30px;width:100%;max-width:760px;max-height:88vh;overflow:auto;}
  @media(min-width:760px){.modal-bg{align-items:center;}.modal{border-radius:24px;}}
  .modal h2{font-size:20px;font-weight:800;margin-bottom:14px;}
  .hidden{display:none!important;}
  a{color:var(--violet);}

  /* ===== refreshed identity ===== */

  .chip-info{background:#ECE8F3;color:var(--teal-deep);}

  :root{--tint-v:#F1ECF7;--tint-v-bd:#E0D6EC;--tint-v-ink:#45375F;--warn-ink:#7A5518;--warn-bd:#E6D5AE;--clay-ink:#8F2F29;--clay-bd:#E9C6C3;
    --tint-e:#E8F2EF;--tint-e-bd:#C4DDD5;--tint-e-ink:#244F47;--tint-p:#E7EEF6;--tint-p-bd:#C6D5E6;--tint-p-ink:#28405E;--tint-g:#EEF5F1;--tint-g-ink:#24573E;
    --body:#E7E1EF;--field:#fff;--on-status:#fff;--glass:rgba(247,245,250,.9);--navglass:rgba(255,254,255,.95)}
  header{background:var(--glass)!important}
  nav.tabs{background:var(--navglass)!important}
  /* ===== dark theme ===== */
  :root[data-theme="dark"]{
    --teal:#A893D4; --teal-deep:#CBBDF0; --violet:#B9A8DC; --plum:#A893D4; --berry:#E07FAF;
    --ink:#ECE8F3; --soft:#A7A0B4; --line:#3A3448; --bg1:#15121C; --bg2:#1A1623;
    --card:#211C2B; --good:#62C08E; --warn:#E0AC52; --warn-soft:#352B19; --sage:#8D85A0; --clay:#EA7468; --clay-soft:#3B2226; --gold:#E7B96A;
    --c-mcas:#C982AA; --c-eds:#5DB5A2; --c-pots:#76A0D6;
    --grad:linear-gradient(135deg,#7D69A6,#54457C);
    --tint-v:#2B243A;--tint-v-bd:#3E3553;--tint-v-ink:#DDD3F0;--warn-ink:#F0CF92;--warn-bd:#4D3E22;--clay-ink:#F4B3AC;--clay-bd:#5A2F33;
    --tint-e:#1B2D29;--tint-e-bd:#2B4740;--tint-e-ink:#A8DCCF;--tint-p:#1B2534;--tint-p-bd:#2C3C54;--tint-p-ink:#B4CBEA;--tint-g:#1C2C24;--tint-g-ink:#A9DDBF;
    --body:#3A3448;--field:#191520;--on-status:#15121C;--glass:rgba(21,18,28,.88);--navglass:rgba(33,28,43,.94);

  }
  :root[data-theme="dark"] body::after{opacity:.025;mix-blend-mode:screen}

  :root[data-theme="dark"] input,:root[data-theme="dark"] select,:root[data-theme="dark"] textarea,:root[data-theme="dark"] .custom-add input{background:var(--field);color:var(--ink);border-color:var(--line)}

  :root[data-theme="dark"] .note b{color:var(--warn-ink)}

  :root[data-theme="dark"] .t-eat{background:#1E3326;color:#8FD3A4}

  :root[data-theme="dark"] .t-avoid{background:#3D211C;color:#F0A08C}
  :root[data-theme="dark"] .fflag{background:#25302B;color:#A8DCCF}
  :root[data-theme="dark"] .food-row.pr-safe .fn{color:#8FD3A4}:root[data-theme="dark"] .food-row.pr-risky .fn{color:#E9C779}:root[data-theme="dark"] .food-row.pr-react .fn{color:#F0A08C}
  :root[data-theme="dark"] .modal-bg{background:rgba(5,3,10,.66)}

  /* ===== readability and tap targets ===== */

  /* ===== TrinityMate additions ===== */
  .savebar{position:sticky;bottom:94px;z-index:15;padding:8px 0;background:linear-gradient(180deg,transparent,var(--bg2) 30%)}
  .savebar .btn{box-shadow:0 10px 26px rgba(40,30,60,.28)}
  #lean-overlay{position:fixed;inset:0;z-index:250;background:linear-gradient(172deg,var(--bg1),var(--bg2));overflow:auto;-webkit-overflow-scrolling:touch}

/* Early safety net: if anything in the main script fails to parse or run,
   show the error on screen instead of a silent white page. This block is
   deliberately separate from the main script so it survives even a
   syntax-level failure further down. */
(function(){
  function show(msg){
    try{
      var d=document.getElementById('jserrbar');
      if(!d){
        d=document.createElement('div'); d.id='jserrbar';
        d.style.cssText='position:fixed;top:0;left:0;right:0;z-index:99999;background:#B4487A;color:#fff;font:13px/1.5 -apple-system,BlinkMacSystemFont,sans-serif;padding:10px 44px 10px 14px;text-align:left;white-space:pre-wrap;word-break:break-word;box-shadow:0 2px 10px rgba(0,0,0,.25)';

        x.onclick=function(){d.parentNode&&d.parentNode.removeChild(d);};
        d.appendChild(x);
        var t=document.createElement('div'); t.id='jserrtxt'; d.appendChild(t);
        (document.body||document.documentElement).appendChild(d);
      }
      var t2=document.getElementById('jserrtxt');
      if(t2) t2.textContent='TrinityMate hit a snag on this device: '+msg+'\nYour data is safe. Please screenshot this bar and send it to me so I can fix it quickly.';
    }catch(e){}
  }
  window.addEventListener('error',function(ev){
    show((ev.message||'unknown error')+(ev.lineno?(' [line '+ev.lineno+']'):''));
  });
  window.addEventListener('unhandledrejection',function(ev){
    var r=ev&&ev.reason; show(String(r&&(r.message||r)||'unknown async error'));
  });
})();

/* If this page was opened as a downloaded/attached file (or a copy someone forwarded) rather
   than the real hosted address, buttons and taps can silently stop doing anything: some
   mail/Messages/Files previewers (iOS Quick Look in particular) render the page but never run
   its JavaScript at all, so typing in a plain text box still "works" while every button, pill,
   and check-in tap does nothing. Flag that immediately and unmissably, rather than only in the
   install card, since a person hitting this never gets far enough to see that card. */
(function(){
  try{
    if(location.protocol==='file:'){
      var CANONICAL_URL='https://moniuet.github.io/trinitymate/';
      var el=document.getElementById('filewarn');
      if(el){

          'Buttons and check-ins may not respond here. Please open '+
          '<a href="'+CANONICAL_URL+'">'+CANONICAL_URL+'</a> directly in Safari or Chrome instead.';
      }

  }catch(e){}
})();

  Object.keys(s.spoons).forEach(d=>{const v=s.spoons[d];if(!v||typeof v!=='object'||!Array.isArray(v.used))delete s.spoons[d];else v.budget=Number(v.budget)||12;});

  s.customfoods=s.customfoods.filter(x=>typeof x==='string');

/* Strip angle brackets from everything people type, so a food name or note can never

function scrub(o,depth){

  if(Array.isArray(o)){for(let i=0;i<o.length;i++){const v=o[i];if(typeof v==='string'){if(/[<>]/.test(v))o[i]=v.replace(/[<>]/g,'');}else if(v&&typeof v==='object')scrub(v,depth+1);}return o;}
  for(const k of Object.keys(o)){const v=o[k];
    if(/[<>]/.test(k)){const nk=k.replace(/[<>]/g,'');o[nk]=v;delete o[k];}
    if(typeof v==='string'){if(/[<>]/.test(v))o[k.replace(/[<>]/g,'')]=v.replace(/[<>]/g,'');}else if(v&&typeof v==='object')scrub(v,depth+1);}

function flareCheck(){
  const cs=state.checkins.filter(c=>burden(c)!=null).sort((a,b)=>a.date<b.date?-1:1);
  const recent=cs.filter(c=>daysBetween(c.date,today())<=3);
  if(recent.length<2) return null;
  const base=cs.filter(c=>{const dd=daysBetween(c.date,today());return dd>3&&dd<=31;});
  if(base.length<5) return null;
  const bvals=base.map(burden).sort((a,b)=>a-b);
  const bmed=median(bvals);
  const q3=bvals[Math.min(bvals.length-1,Math.floor(bvals.length*0.75))];
  const spread=Math.max(10,q3-bmed);
  const rmed=median(recent.map(burden));
  if(rmed<bmed+spread) return null;
  const rising=[];
  SYMPTOMS.forEach(sy=>{
    const bv=base.map(c=>c.sev&&c.sev[sy.k]).filter(v=>v!=null);
    const rv=recent.map(c=>c.sev&&c.sev[sy.k]).filter(v=>v!=null);
    if(bv.length>=3&&rv.length>=2&&median(rv)-median(bv)>=1)rising.push(sy.label);
  });
  return {rmed,bmed,rising:rising.slice(0,3)};
}

  return `<div class="card"><h2>Reactions and tryptase, together</h2>

/* ---------------- guided NASA lean test (POTS) ----------------
   Lie 5 minutes, take heart rate, then stand leaning on a wall for 10 minutes with
   readings at 2, 5 and 10. Clinicians use the same test; this is the home version. */
const LEAN_CHECKS=[2,5,10];
const LEAN_SYMS=[['dizzy','Dizzy'],['racing','Racing heart'],['nausea','Nausea'],['legs','Legs going purple'],['tremor','Shaky'],['vision','Blurry vision']];
let lean=null, leanTimer=null, leanWake=null;
function openLean(){
  lean={phase:'intro',t0:null,lying:'',lyingBP:'',hr:{},syms:[],stoppedAt:null};
  drawLean();
}
/* iPhones only allow sound that was switched on by a tap, so the audio is "unlocked" when
   the person taps Start (or Test sound), then reused for every beep. Asking for the
   'playback' audio session lets it sound even with the ring/silent switch on (Safari 17+). */
let leanAudio=null;
function leanUnlockAudio(){
  try{if(navigator.audioSession)navigator.audioSession.type='playback';}catch(e){}
  try{
    const A=window.AudioContext||window.webkitAudioContext; if(!A)return;
    if(!leanAudio)leanAudio=new A();
    if(leanAudio.state==='suspended')leanAudio.resume();
    const buf=leanAudio.createBuffer(1,1,22050),src=leanAudio.createBufferSource();
    src.buffer=buf;src.connect(leanAudio.destination);src.start(0);
  }catch(e){}
}
function leanTone(ctx,t,freq,len){
  const o=ctx.createOscillator(),g=ctx.createGain();
  o.type='sine';o.frequency.value=freq;o.connect(g);g.connect(ctx.destination);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.5,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+len);
  o.start(t);o.stop(t+len+.02);
}
function leanBeep(){
  try{navigator.vibrate&&navigator.vibrate([180,80,180,80,180]);}catch(e){}
  try{
    if(!leanAudio)leanUnlockAudio();
    const ctx=leanAudio; if(ctx){
      if(ctx.state==='suspended')ctx.resume();
      const t=ctx.currentTime+.05;
      leanTone(ctx,t,880,.28);leanTone(ctx,t+.35,880,.28);leanTone(ctx,t+.7,1175,.45);
    }
  }catch(e){}
  /* a visual cue as well, in case the phone is muted */
  try{const el=document.getElementById('lean-overlay');if(el){el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash');}}catch(e){}
}
async function leanKeepAwake(on){
  try{if(on&&'wakeLock' in navigator){leanWake=await navigator.wakeLock.request('screen');}else if(!on&&leanWake){await leanWake.release();leanWake=null;}}catch(e){}
}
function leanClock(sec){const m=Math.floor(sec/60),s=Math.floor(sec%60);return m+':'+String(s).padStart(2,'0');}
function leanStart(phase){
  leanUnlockAudio();
  lean.phase=phase; lean.t0=Date.now(); lean.fired={};
  clearInterval(leanTimer); leanTimer=setInterval(leanTick,250); leanKeepAwake(true); drawLean();
}
function leanTick(){
  if(!lean||!lean.t0)return;
  const el=(Date.now()-lean.t0)/1000;
  const clk=document.getElementById('lean-clock'), bar=document.getElementById('lean-bar');
  if(lean.phase==='lie'){
    const left=Math.max(0,300-el);
    if(clk)clk.textContent=leanClock(left);
    if(bar)bar.style.width=Math.min(100,el/300*100)+'%';
    if(left<=0&&!lean.fired.lie){lean.fired.lie=true;leanBeep();lean.phase='lyingHR';clearInterval(leanTimer);drawLean();}
  }else if(lean.phase==='stand'){
    if(clk)clk.textContent=leanClock(Math.min(el,600));
    if(bar)bar.style.width=Math.min(100,el/600*100)+'%';
    LEAN_CHECKS.forEach(m=>{
      const inp=document.getElementById('lean-hr-'+m);
      if(el>=m*60){
        if(inp&&inp.disabled){inp.disabled=false;inp.closest('.lean-row').classList.add('due');}
        if(!lean.fired[m]){lean.fired[m]=true;leanBeep();if(inp)setTimeout(()=>inp.focus(),50);}
      }
    });
    if(el>=600&&!lean.fired.end){lean.fired.end=true;}
  }
}
function leanStop(early){
  const vals=LEAN_CHECKS.map(m=>Number(lean.hr[m])).filter(v=>v>0);
  const lying=Number(lean.lying);
  if(!(lying>0)||!vals.length){
    if(early){toast('Test stopped. Sit down safely.');leanCancel();return;}
    toast('Type in at least one standing reading first');return;
  }
  if(lean.phase==='stand'&&early) lean.stoppedAt=Math.round((Date.now()-lean.t0)/60000*10)/10;
  clearInterval(leanTimer); leanKeepAwake(false);
  const max=Math.max(...vals);
  const hrNum={};LEAN_CHECKS.forEach(m=>{const v=Number(lean.hr[m]);if(v>0)hrNum[m]=v;});
  const test={date:today(),time:nowHM(),lying,lyingBP:lean.lyingBP||'',hr:hrNum,max,rise:max-lying,syms:[...lean.syms],stoppedAt:lean.stoppedAt};
  state.leanTests.push(test);
  /* feed today's check-in vitals if they are empty */
  const c=state.checkins.find(x=>x.date===today());
  let vn='';
  if(c){
    if(c.restHR==null&&c.standHR==null){c.restHR=lying;c.standHR=max;vn="Today's check-in heart rates have been filled in from it.";}
    else vn="Today's check-in already had heart rates, so those were kept.";
  }else{
    if(draftDate!==today()){draft=blankDraft();draftDate=today();}
    if(draft.restHR===''&&draft.standHR===''){draft.restHR=lying;draft.standHR=max;vn="The heart rates are ready in today's check-in. Tap save there when you're ready.";}
  }
  save(); lean.phase='done'; lean.result=Object.assign({},test,{vitalsNote:vn}); drawLean();
}
function leanCancel(){clearInterval(leanTimer);leanKeepAwake(false);lean=null;const el=document.getElementById('lean-overlay');if(el)el.remove();document.body.classList.remove('lean-mode');render();}
function leanChart(t,w,h){
  w=w||300;h=h||120;
  const pts=[[0,t.lying]].concat(LEAN_CHECKS.filter(m=>Number(t.hr[m])>0).map(m=>[m,Number(t.hr[m])]));
  const vals=pts.map(p=>p[1]).concat([t.lying+30]);
  const lo=Math.min(...vals)-8, hi=Math.max(...vals)+8;
  const X=m=>14+m/10*(w-28), Y=v=>10+(1-(v-lo)/(hi-lo))*(h-30);
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="display:block" preserveAspectRatio="xMidYMid meet">
    <line x1="14" x2="${w-14}" y1="${Y(t.lying+30).toFixed(1)}" y2="${Y(t.lying+30).toFixed(1)}" stroke="var(--warn)" stroke-dasharray="4 4" stroke-width="1.5"/>
    <text x="${X(1).toFixed(1)}" y="${(Y(t.lying+30)+12).toFixed(1)}" font-size="9" font-weight="700" fill="var(--warn)">+30 bpm line</text>
    <polyline fill="none" stroke="var(--c-pots)" stroke-width="2.5" stroke-linejoin="round" points="${pts.map(p=>X(p[0]).toFixed(1)+','+Y(p[1]).toFixed(1)).join(' ')}"/>
    ${pts.map(p=>`<circle cx="${X(p[0]).toFixed(1)}" cy="${Y(p[1]).toFixed(1)}" r="4" fill="var(--c-pots)" stroke="var(--card)" stroke-width="1.5"/><text x="${X(p[0]).toFixed(1)}" y="${(Y(p[1])-8).toFixed(1)}" font-size="9.5" font-weight="700" fill="var(--ink)" text-anchor="middle">${p[1]}</text>`).join('')}
    ${[0].concat(LEAN_CHECKS).map(m=>`<text x="${X(m).toFixed(1)}" y="${h-4}" font-size="9" fill="var(--soft)" text-anchor="middle">${m===0?'lying':m+' min'}</text>`).join('')}
  </svg>`;
}
function leanVerdict(t){
  const young=state.profile.yob&&(new Date().getFullYear()-Number(state.profile.yob))<20;
  const thr=young?40:30;
  return t.rise>=thr
    ? `Your heart rate rose by <b>${t.rise} bpm</b> (from ${t.lying} lying to ${t.max} standing). A rise of ${thr} bpm or more within 10 minutes is the threshold clinicians use when assessing POTS. A home test can't diagnose anything, but this is worth showing your doctor, especially if it happens on repeat tests.`
    : `Your heart rate rose by <b>${t.rise} bpm</b> (from ${t.lying} lying to ${t.max} standing). That is under the usual ${thr} bpm threshold this time. Results vary day to day, with heat, fluids, time of day and medicines, so a few tests on different days tell you more than one.`;
}

const JOINT_POINTS=[

      ${limb(J('Shoulder','right'),J('Elbow','right'))}${limb(J('Elbow','right'),J('Wrist / hand','right'))}${limb(J('Wrist / hand','right'),J('Finger','right'))}
      ${limb(J('Shoulder','left'),J('Elbow','left'))}${limb(J('Elbow','left'),J('Wrist / hand','left'))}${limb(J('Wrist / hand','left'),J('Finger','left'))}
      ${limb(J('Hip','right'),J('Knee','right'))}${limb(J('Knee','right'),J('Ankle / foot','right'))}

  const max=counts?Math.max(1,...counts):1;
  const dots=JOINT_POINTS.map((p,i)=>{

/* ---------------- trigger finder: lag-aware, per condition ----------------
   Each condition gets its own look-ahead window: mast cell reactions can lag up to
   48 hours, EDS "payback" often lands the next day, POTS crashes tend to be same-day. */
const FINDER_WIN={mcas:[0,2,'within 2 days'],eds:[0,1,'same or next day'],pots:[0,0,'the same day']};
function triggerFinder(k){
  const cs=[...state.checkins].sort((a,b)=>a.date<b.date?-1:1);
  if(cs.length<8) return null;
  const act=new Set(cs.filter(c=>condActiveOn(c,k)).map(c=>c.date));
  const [a,b]=FINDER_WIN[k];
  const hit=d=>{for(let o=a;o<=b;o++){if(act.has(iso2(d,o)))return true;}return false;};
  const dates=cs.map(c=>c.date);
  const base=dates.filter(hit).length/dates.length;
  const rows=[];
  activeTriggers().forEach(t=>{
    const ds=cs.filter(c=>(c.triggers||[]).includes(t.k)).map(c=>c.date);
    if(ds.length<3)return;
    const rate=ds.filter(hit).length/ds.length;
    rows.push({t,n:ds.length,rate,lift:rate-base});
  });
  /* spoons: going over budget is a trigger in its own right */
  const over=cs.filter(c=>{const sp=state.spoons[c.date];return sp&&spoonsUsed(c.date)>sp.budget;}).map(c=>c.date);
  if(over.length>=3){const rate=over.filter(hit).length/over.length;rows.push({t:{k:'overspent',e:'🥄',label:'Going over your spoon budget'},n:over.length,rate,lift:rate-base});}
  return {base,rows:rows.sort((x,y)=>y.lift-x.lift),n:cs.length,active:act.size};
}
function finderWindowsText(){
  const parts=[];
  if(has('mcas'))parts.push('mast cell reactions get up to 48 hours');
  if(has('eds'))parts.push('joints get the next day, for payback');
  if(has('pots'))parts.push('POTS looks at the same day');
  if(!parts.length)return '';
  const t=parts.length===1?parts[0]:parts.slice(0,-1).join(', ')+' and '+parts[parts.length-1];
  return t.charAt(0).toUpperCase()+t.slice(1)+'.';
}
function pl(n,one,many){return n+' '+(n===1?one:(many||one+'s'));}
function finderCard(){
  if(!condCount()) return '';
  const pct=v=>Math.round(v*100)+'%';
  const conf=n=> n>=8?{t:'strong signal',c:'var(--good)'} : n>=5?{t:'building',c:'var(--warn)'} : {t:'early, needs more data',c:'var(--soft)'};
  const sections=activeConds().map(k=>{
    const f=triggerFinder(k); if(!f||!f.active) return '';
    const sus=f.rows.filter(r=>r.lift>=0.15&&r.rate>=0.4).slice(0,4);
    const ok=f.rows.filter(r=>r.lift<=-0.05).slice(-2).reverse();
    if(!sus.length&&!ok.length) return `<div style="margin-top:14px">${cchip(k)}<div class="muted" style="font-size:13px;margin-top:6px">No trigger stands out yet. Keep tagging.</div></div>`;
    const bar=(r,col)=>{const cf=conf(r.n);return `<div style="margin:10px 0">
      <div style="display:flex;justify-content:space-between;font-size:13px;align-items:baseline;gap:8px"><b>${r.t.e} ${r.t.label}</b><span class="muted" style="white-space:nowrap">${pct(r.rate)} of ${r.n}×</span></div>
      <div style="height:8px;border-radius:4px;background:var(--line);margin-top:5px;overflow:hidden"><div style="width:${pct(r.rate)};height:100%;background:${col}"></div></div>
      <div style="font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;margin-top:4px;color:${cf.c}">${cf.t}</div></div>`;};
    return `<div style="margin-top:16px;padding-top:12px;border-top:1px solid var(--line)">
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">${cchip(k)}<span class="muted" style="font-size:12.5px">flared ${FINDER_WIN[k][2]} after ${pct(f.base)} of all days</span></div>

    </div>`;
  }).join('');
  if(!sections.trim()) return `<div class="card"><h2>Trigger finder</h2><div class="csub">Tag what might have affected each day in your check-ins, good days included. After about 8 check-ins this shows which triggers tend to come before a flare of each condition, with the right delay for each.</div></div>`;
  return `<div class="card"><h2>Trigger finder</h2>
    <div class="csub">How often each condition flared after a tagged trigger, compared with your usual rate. ${finderWindowsText()}</div>
    ${sections}
    <div class="disc">Patterns, not proof. Early signals rest on very few days. Use this to plan careful tests with your clinician, one change at a time.</div>
  </div>`;
}

function correlationCard(){
  const cs=state.checkins.filter(c=>Array.isArray(c.triggers)).map(c=>({c,b:burden(c)})).filter(x=>x.b!=null);
  if(cs.length<4)return '';
  const rows=[];
  activeTriggers().forEach(t=>{
    const withT=cs.filter(x=>x.c.triggers.includes(t.k)).map(x=>x.b);
    const without=cs.filter(x=>!x.c.triggers.includes(t.k)).map(x=>x.b);
    if(withT.length>=2&&without.length>=2){
      const a=withT.reduce((x,y)=>x+y,0)/withT.length;
      const b=without.reduce((x,y)=>x+y,0)/without.length;
      const diff=Math.round(a-b);
      if(diff>=5)rows.push({t,diff,n:withT.length});
    }
  });
  if(!rows.length)return '';
  rows.sort((x,y)=>y.diff-x.diff);

 {k:'faint', e:'🫀', n:'Feeling faint', tone:'warn', c:'pots', head:'Get low, fast',
  body:`Sit or lie down straight away, before you fall, with your legs raised if you can. Cross your legs and squeeze your thighs, bottom and fists to push blood back up. Once the wave passes, sip water or an electrolyte drink, cool down if you are hot, and get up slowly in stages.${'{MCASNOTE}'} Get medical help if you hurt yourself falling, have chest pain, or if fainting is new or different for you.`},
 {k:'joint', e:'🦴', n:'A joint has slipped', tone:'warn', c:'eds', head:'Support it, then rest it',
  body:`If it is a slip you know how to settle, follow the plan your physio gave you. Support the joint, ice it if it is fresh, warm or swollen, then rest it. Do not force a joint back if it will not go. A new joint, numbness, a cold or pale limb, or severe pain needs urgent medical care. Log it on the check-in afterwards so the pattern is on record.`},
 {k:'mid', e:'🌊', n:'Riding out a bigger reaction', tone:'clay', c:'mcas', head:'Watch it, do not white-knuckle it',
  body:`Keep following your agreed rescue plan and stay somewhere you can rest with someone aware, if possible. Cool the skin, keep fluids going, skip food until things settle. Reactions that keep escalating despite your rescue meds belong in front of a clinician today, not tomorrow. And keep checking against the emergency signs in the next tab.`},
 {k:'help', e:'🚨', n:'Emergency signs', tone:'clay', c:'mcas', head:'These mean 999, not waiting',
  body:`Throat tightness or trouble swallowing, real difficulty breathing or wheeze that is getting worse, feeling faint or collapsing, widespread hives with any of the above, or a sense of dread with rapidly building symptoms: treat this as anaphylaxis. If you carry an adrenaline pen, use it immediately, then call 999 (an ambulance is needed even after the pen). Do not stand or walk suddenly; lie down with legs raised unless breathing is easier sitting. Never wait to see if it passes.`},
 {k:'after', e:'📈', n:'It has settled', tone:'good', c:'any', head:'Turn it into data',
  body:`{AFTER}`},
];
function aidList(){
  return AID.filter(a=>a.c==='any'?condCount()>0:has(a.c)).map(a=>{
    let body=a.body.replace('{MCASNOTE}',has('mcas')?' With MCAS too: if faintness comes with throat, breathing or hive symptoms, treat it as an emergency (see Emergency signs).':'');
    if(a.k==='after'){
      body='Log the day on the check-in, including what helped, so your rescue playbook builds up.'
        +(has('mcas')?' Tag every food from the last 48 hours and any non-food triggers: the correlator only works if reactions get recorded. After a significant reaction, a tryptase blood test within 1 to 4 hours of onset is the gold-standard evidence, worth arranging in advance with your doctor for next time.':'')

function nowHM(){const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}

  state.prn.push({date:today(),time:time||nowHM(),name});

  save();toast(name+' logged at '+(time||nowHM()));
}
function delPRN(i){state.prn.splice(i,1);save();render();}

const LABDEFS=[
  {k:'tryp',label:'Tryptase',hint:'\u00b5g/L; a baseline sample, or one taken 1 to 4 hours after a big reaction'},
  {k:'vitd',label:'Vitamin D',hint:'nmol/L; if your lab uses ng/mL, multiply by 2.5'},
  {k:'fer',label:'Ferritin',hint:'\u00b5g/L (same as ng/mL)'},
  {k:'b12',label:'Vitamin B12',hint:'ng/L (same as pg/mL)'},
];
let labDraft={date:today()};
function labDefs(){return LABDEFS.filter(d=>d.k!=='tryp'||has('mcas'));}
const LABREF={
  tryp:{       hi:11.4, unit:'\u00b5g/L', type:'upper', name:'Tryptase'},
  vitd:{lo:50, hi:125,  unit:'nmol/L',    type:'band',  name:'Vitamin D'},
  fer :{lo:30, hi:150,  unit:'\u00b5g/L', type:'band',  name:'Ferritin'},
  b12 :{lo:180,hi:900,  unit:'ng/L',      type:'band',  name:'Vitamin B12'},
};
/* comfort targets some clinicians prefer for energy symptoms; agree yours with your own team. */
const LABOPT={ fer:{lo:70,hi:150}, vitd:{lo:75,hi:125} };
function labView(){return state.settings&&state.settings.labView==='optimal'?'optimal':'standard';}
function activeRef(key){const r=LABREF[key];if(!r)return null;if(labView()==='optimal'&&LABOPT[key])return Object.assign({},r,LABOPT[key]);return r;}
const LABCOL={in:'var(--good)',normal:'var(--good)',above:'var(--clay)',elevated:'var(--clay)',below:'var(--warn)'};
function labTxt(st){const opt=labView()==='optimal';
  return ({in:opt?'at target':'in range', normal:'normal', above:opt?'above target':'above range', elevated:'elevated', below:opt?'below target':'below range'})[st];}
function labStatus(key,v){const r=activeRef(key);if(!r||v==null||isNaN(v))return null;
  if(r.type==='band'){if(v<r.lo)return 'below';if(v>r.hi)return 'above';return 'in';}
  if(r.type==='floor'){return v<r.lo?'below':'normal';}
  return v>r.hi?'elevated':'normal';}
function setLabView(v){state.settings.labView=v;save();render();}
function labChart(key){
  const r=activeRef(key);
  const pts=state.labs.filter(x=>x[key]!=null&&x[key]!=='').map(x=>({date:x.date,v:parseFloat(x[key])})).filter(p=>!isNaN(p.v)).sort((a,b)=>a.date<b.date?-1:1);
  if(!pts.length) return '';
  const W=320,H=118,padL=8,padR=8,padT=12,padB=20,iw=W-padL-padR,ih=H-padT-padB;
  const vals=pts.map(p=>p.v);
  let lo=Math.min(...vals, r.type==='band'||r.type==='floor'?r.lo:0);
  let hi=Math.max(...vals, r.hi!=null?r.hi:Math.max(...vals));
  const span=(hi-lo)||1, yp=span*0.12; lo-=yp; hi+=yp;
  const X=i=>padL+(pts.length===1?iw/2:i/(pts.length-1)*iw);
  const Y=v=>padT+(1-(v-lo)/(hi-lo))*ih;
  let band,refLines;
  if(r.type==='band'){band=`<rect x="${padL}" y="${Y(r.hi).toFixed(1)}" width="${iw}" height="${(Y(r.lo)-Y(r.hi)).toFixed(1)}" fill="var(--teal)" opacity="0.12"/>`;
    refLines=[r.lo,r.hi].map(v=>`<line x1="${padL}" y1="${Y(v).toFixed(1)}" x2="${padL+iw}" y2="${Y(v).toFixed(1)}" stroke="var(--teal)" stroke-width="1" stroke-dasharray="3 3" opacity="0.55"/>`).join('');
  }else if(r.type==='floor'){band=`<rect x="${padL}" y="${padT}" width="${iw}" height="${Math.max(0,(Y(r.lo)-padT)).toFixed(1)}" fill="var(--teal)" opacity="0.12"/>`;
    refLines=`<line x1="${padL}" y1="${Y(r.lo).toFixed(1)}" x2="${padL+iw}" y2="${Y(r.lo).toFixed(1)}" stroke="var(--teal)" stroke-width="1" stroke-dasharray="3 3" opacity="0.55"/>`;
  }else{band=`<rect x="${padL}" y="${Y(r.hi).toFixed(1)}" width="${iw}" height="${(padT+ih-Y(r.hi)).toFixed(1)}" fill="var(--teal)" opacity="0.12"/>`;
    refLines=`<line x1="${padL}" y1="${Y(r.hi).toFixed(1)}" x2="${padL+iw}" y2="${Y(r.hi).toFixed(1)}" stroke="var(--teal)" stroke-width="1" stroke-dasharray="3 3" opacity="0.55"/>`;}
  const line=pts.length>1?`<polyline fill="none" stroke="var(--ink)" stroke-width="2" opacity="0.5" points="${pts.map((p,i)=>X(i).toFixed(1)+','+Y(p.v).toFixed(1)).join(' ')}"/>`:'';
  const dots=pts.map((p,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="4" fill="${LABCOL[labStatus(key,p.v)]}" stroke="#fff" stroke-width="1.5"/>`).join('');
  const lastp=pts[pts.length-1], st=labStatus(key,lastp.v);
  let eng;
  if(pts.length>1){const f=pts[0].v; eng = f===lastp.v?`Holding at ${lastp.v} ${r.unit}, currently ${labTxt(st)}.`:`Moved ${lastp.v<f?'down':'up'} from ${f} to ${lastp.v} ${r.unit}, now ${labTxt(st)}.`;}
  else eng=`One result so far: ${lastp.v} ${r.unit}, ${labTxt(st)}.`;
  return `<div style="margin:18px 0 4px">
    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px">
      <b style="font-size:14.5px">${r.name}</b>
      <span style="font-size:12px;font-weight:700;color:var(--on-status);background:${LABCOL[st]};padding:3px 10px;border-radius:999px">${lastp.v} · ${labTxt(st)}</span>
    </div>
    <svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;margin-top:6px" preserveAspectRatio="xMidYMid meet">
      ${band}${refLines}${line}${dots}
      <text x="${padL}" y="${H-6}" font-size="9" fill="var(--soft)">${fmt(pts[0].date)}</text>
      ${pts.length>1?`<text x="${padL+iw}" y="${H-6}" font-size="9" fill="var(--soft)" text-anchor="end">${fmt(lastp.date)}</text>`:''}
    </svg>
    <div class="muted" style="font-size:13px">${eng}</div>
  </div>`;
}
function labTrendsCard(){
  const keys=Object.keys(LABREF).filter(k=>state.labs.some(x=>x[k]!=null&&x[k]!==''));
  if(!keys.length) return '';
  const opt=labView()==='optimal';
  return `<div class="card"><h2>Your trends</h2>
    <div class="csub">Each result plotted against a shaded target range</div>
    <div class="pill-row" style="margin-bottom:6px">
      <span class="pill ${!opt?'on':''}" onclick="setLabView('standard')">Standard lab range</span>
      <span class="pill ${opt?'on':''}" onclick="setLabView('optimal')">Comfort targets</span>
    </div>
    ${keys.map((k,i)=>labChart(k)+(i<keys.length-1?'<div style="border-top:1px solid var(--line)"></div>':'')).join('')}
    <div class="disc">${opt
      ? 'Comfort targets mark the ferritin and vitamin D levels some clinicians prefer before energy and histamine symptoms settle. Tryptase is unchanged: the useful comparison there is a reaction-window sample against your own baseline (a rise of 20% + 2 is the classic flag). Agree targets with your own team.'
      : 'Standard laboratory reference ranges. These vary between labs, so read yours alongside the range printed on your own results.'}</div>
  </div>`;
}

function labsForVisit(){
  return `
    <div class="card">
      <h2>Blood results</h2>
      <div class="csub">Optional. ${has('mcas')?'In MCAS, timing beats the number: tryptase is most useful drawn 1 to 4 hours after a big reaction, next to your baseline.':'Ferritin, vitamin D and B12 are worth keeping an eye on, because low levels add to fatigue, dizziness and brain fog.'}</div>

      ${[
        has('mcas')?['Tryptase','The main mast cell blood marker. A normal baseline does NOT rule MCAS out: the telling test is a sample drawn 1 to 4 hours after a significant reaction, compared with your own baseline (a rise of 20% + 2 \u00b5g/L supports mast cell activation). A persistently high baseline needs its own follow-up.']:null,
        ['Vitamin D','Commonly low in chronic illness and worth optimising: it plays a role in immune regulation and energy.'],
        ['Ferritin','Your iron store. Low ferritin worsens fatigue, dizziness and brain fog, symptoms that overlap heavily with '+(condNames()||'MCAS, EDS and POTS')+'. Low iron is also linked with worse POTS symptoms for some people.'],

      ].filter(Boolean).map(([t,d])=>`<div style="margin:12px 0"><b>${t}</b><div class="muted" style="font-size:14px">${d}</div></div>`).join('')}

  `;

function saveLab(){
  const rec={date:labDraft.date||today()};let any=false;
  LABDEFS.forEach(d=>{if(labDraft[d.k]){rec[d.k]=labDraft[d.k];any=true;}});
  if(!any){toast('Enter at least one value');return;}
  const idx=state.labs.findIndex(x=>x.date===rec.date);
  if(idx>=0)state.labs[idx]=rec;else state.labs.push(rec);
  state.labs.sort((a,b)=>a.date<b.date?-1:1);
  labDraft={date:today()};save();toast('Result saved');render();
}

const BEIGHTON_ITEMS=[
  {k:'pinkyL',label:'Little finger bends back past 90° (left)'},
  {k:'pinkyR',label:'Little finger bends back past 90° (right)'},
  {k:'thumbL',label:'Thumb bends back to touch the forearm (left)'},
  {k:'thumbR',label:'Thumb bends back to touch the forearm (right)'},
  {k:'elbowL',label:'Elbow bends back past straight (left)'},
  {k:'elbowR',label:'Elbow bends back past straight (right)'},
  {k:'kneeL',label:'Knee bends back past straight (left)'},
  {k:'kneeR',label:'Knee bends back past straight (right)'},
  {k:'palms',label:'Palms flat on the floor, legs straight'},
];
let beightonDraft={};
function latestBeighton(){return last(state.beighton);}
function beightonInterpret(score){
  if(score>=6)return 'Suggestive of generalised joint hypermobility. Worth discussing with a doctor, ideally alongside your other symptoms.';
  if(score>=4)return 'Around the commonly used adult threshold, which depends on age and sex. Not diagnostic alone, but worth mentioning alongside your other symptoms.';
  return 'Below the usual adult threshold. A lower score doesn’t rule out hypermobility elsewhere in the body that Beighton doesn’t test.';
}
function toggleBeightonItem(k){beightonDraft[k]=!beightonDraft[k];render();}
function saveBeighton(){
  const items={...beightonDraft};
  const score=BEIGHTON_ITEMS.reduce((n,it)=>n+(items[it.k]?1:0),0);
  state.beighton.push({date:today(),score,items});
  state.beighton.sort((a,b)=>a.date<b.date?-1:1);
  beightonDraft={};save();toast('Beighton score saved');render();
}
function delBeighton(idx){state.beighton.splice(idx,1);save();render();}
function beightonCard(){
  const tally=BEIGHTON_ITEMS.reduce((n,it)=>n+(beightonDraft[it.k]?1:0),0);
  return `<div class="card">
    <h2>Beighton score ${cchip('eds')}</h2>

    ${state.beighton.length?`<div style="margin-top:14px">${state.beighton.slice(-5).reverse().map((b,i)=>{const idx=state.beighton.length-1-i;return `<div class="item"><div><b>${b.score}/9</b><div class="muted">${fmt(b.date)}</div></div><span class="x" onclick="delBeighton(${idx})">delete</span></div>`;}).join('')}</div>

}

function flareEpisodes(){
  const days=state.checkins.filter(isBadDay).map(c=>c.date).sort();
  if(!days.length)return [];
  const eps=[];let cur={start:days[0],end:days[0]};
  for(let i=1;i<days.length;i++){
    if(daysBetween(cur.end,days[i])<=2){cur.end=days[i];}
    else{eps.push(cur);cur={start:days[i],end:days[i]};}
  }
  eps.push(cur);
  return eps.map(e=>{
    const cs=state.checkins.filter(c=>c.date>=e.start&&c.date<=e.end);
    const peak=Math.max(...cs.map(c=>burden(c)||0));
    const conds=activeConds().filter(k=>cs.some(c=>condActiveOn(c,k)));
    const foods=has('mcas')?[...new Set(state.checkins.filter(c=>c.date>=iso2(e.start,-2)&&c.date<=e.end).flatMap(c=>c.foods||[]))].map(k=>(FOODTAGS.find(j=>j.k===k)||{}).label||k.replace(/^cf:/,'')):[];
    const trigs=[...new Set(state.checkins.filter(c=>c.date>=iso2(e.start,-2)&&c.date<=e.end).flatMap(c=>c.triggers||[]))].map(k=>(TRIGGERS.find(t=>t.k===k)||{}).label||k);
    const joints=state.jointEvents.filter(j=>j.date>=e.start&&j.date<=e.end).map(jointLabel);
    return {...e,len:daysBetween(e.start,e.end)+1,peak,foods,trigs,conds,joints};
  }).reverse();
}
function iso2(d,off){const x=new Date(d+'T00:00Z');x.setUTCDate(x.getUTCDate()+off);return x.toISOString().slice(0,10);}
function episodesCard(){

/* personalised tips engine (research-based, hedged) */
function tips(){
  const p=state.profile, out=[];
  if(p.stage==='Newly exploring') out.push(['🌱','Starting out','None of these conditions has one big fix. The early wins are boring and steady: consistent meds, a faithful daily log, and one change at a time. Patterns appear faster than you expect.']);
  if(p.stage==='In a rough patch') out.push(['🫂','Rough patches end','Illness, heat, poor sleep and hormonal shifts can all raise your baseline for a while. That is not the same as things getting permanently worse. Log through it and shrink the world temporarily, not permanently.']);
  if(condCount()>1) out.push(['🔗','One body, one log','Your conditions share triggers and can set each other off. Logging them together is what lets TrinityMate show the overlap, so keep tagging triggers even on days only one of them is playing up.']);
  if(has('mcas')&&has('pots')) out.push(['🫀','MCAS and POTS feed each other','Mast cell flares can drop blood pressure and send heart rate up, and heat, standing and dehydration hit both. Fluids and a cool environment often help on both fronts. Make sure each specialist knows about the other condition.']);
  if(has('eds')&&has('pots')) out.push(['🧬','The hEDS and POTS link','Joint hypermobility and POTS are commonly linked. Physio aimed at both together, often starting with reclined exercise, tends to work best.']);
  if(has('eds')&&has('mcas')) out.push(['💊','Painkillers with MCAS','Joint pain plans often reach for NSAIDs, which are a common mast cell trigger. Agree a painkiller plan with your doctor that suits both.']);
  const dc=last(state.dosechanges);
  if(dc) out.push(['🗓️','Judging a med change','Give medication changes about 6 weeks and change one thing at a time. Your hard-day count before and after is the fairest verdict, and TrinityMate is already keeping it.']);
  if(has('pots')) out.push(['🧂','Salt needs a doctor’s steer','More salt is common POTS advice, but not for everyone. It depends on your type and any heart or kidney conditions. Get a number from your own doctor rather than guessing.']);
  if(has('pots')) out.push(['🛏️','Lie down, legs up','If you feel faint, lying down with your legs raised works faster than sitting. Get up again slowly, in stages.']);
  if(has('eds')) out.push(['🧘','Pacing beats pushing through','Little and often, with planned rest, tends to reduce flares far more than a big push followed by days of payback.']);
  if(has('eds')&&p.goals.includes('Fewer joint events')) out.push(['🦾','Bracing is a tool, not a crutch','Targeted bracing during higher-risk activity protects a joint without weakening the muscles around it the way constant all-day wear can.']);
  if(has('mcas')&&p.pregnancy) out.push(['💉','Pen carriers','Check the expiry dates on your adrenaline pens twice a year, keep them in pairs, and make sure the people around you know where they live and how to use them.']);
  if(has('mcas')&&p.goals.includes('Expand my safe foods')) out.push(['🍽️','Elimination is a phase, not a lifestyle','The goal of low-histamine eating is to calm things enough to reintroduce foods one at a time. Staying ultra-restricted long term risks nutrition and quality of life, so plan reintroductions with a professional.']);
  if(has('mcas')) out.push(['🧊','Freeze, don’t fridge','Histamine keeps building in stored food. Cooking fresh and freezing leftovers immediately is the single highest-impact kitchen habit in the histamine world.']);
  if(has('mcas')) out.push(['🧪','The reaction-window blood test','Baseline tryptase is often normal in MCAS. The persuasive test is one drawn 1 to 4 hours after a significant reaction, compared with your baseline. Ask your doctor to set up a standing form so it can happen when needed.']);
  if(!out.length) out.push(['👋','Pick your conditions','Choose MCAS, EDS, POTS or any mix in your profile and your tips appear here.']);
  return out;
}

}

const DIETS=[['gf','Gluten-free'],['df','Dairy-free'],['veg','Vegetarian'],['nf','Nut-free'],['ff','Fish-free']];
function matchesDiet(m){const d=state.diet;return (!d.gf||m.gf)&&(!d.df||m.df)&&(!d.veg||m.veg)&&(!d.nf||m.nf)&&(!d.ff||m.ff);}
function slotPool(slot){const a=MEALS.filter(m=>m.slot===slot&&matchesDiet(m));return a.length?a:MEALS.filter(m=>m.slot===slot);}
function toggleDiet(k){state.diet[k]=!state.diet[k];save();if(state.plan)generatePlan();else renderDiet();}
function generatePlan(){
  const pick=(arr,used)=>{const avail=arr.filter(m=>!used.includes(m.name));const src=avail.length?avail:arr;const m=src[Math.floor(Math.random()*src.length)];used.push(m.name);return m;};
  const pb=slotPool('Breakfast'),pl=slotPool('Lunch'),pd=slotPool('Dinner'),psn=slotPool('Snack');
  const days=[];const ub=[],ul=[],ud=[],us=[];
  for(let i=0;i<7;i++){days.push({b:pick(pb,ub),l:pick(pl,ul),d:pick(pd,ud),s:pick(psn,us)});
    if(ub.length>=pb.length)ub.length=0; if(ul.length>=pl.length)ul.length=0; if(ud.length>=pd.length)ud.length=0; if(us.length>=psn.length)us.length=0;}
  state.plan={created:today(),days};state.shopping={};save();renderDiet();
}
function swapMeal(i,slot){
  const names={b:'Breakfast',l:'Lunch',d:'Dinner',s:'Snack'};
  const pool=slotPool(names[slot]);const cur=state.plan.days[i][slot].name;
  const usedCol=state.plan.days.map(d=>d[slot].name);
  let avail=pool.filter(m=>m.name!==cur&&!usedCol.includes(m.name));
  if(!avail.length)avail=pool.filter(m=>m.name!==cur);
  if(!avail.length)avail=pool;
  state.plan.days[i][slot]=avail[Math.floor(Math.random()*avail.length)];
  save();renderDiet();
}
const CATLIST=[
  ['Produce',['Mixed berries','Banana','Spinach','Broccoli','Sweet potato','Carrots','Onion','Peppers','Green beans','Potatoes','Apples','Cucumber','Tomatoes','Avocado','Rocket','Red onion','Parsley','Lemon','Courgettes','Mixed vegetables','Mixed stir-fry veg','Mixed salad']],
  ['Protein, fish & eggs',['Eggs','Salmon fillet','Tinned sardines','Chicken breast','Cod fillet','Tinned tuna','Turkey slices','Turkey mince','Prawns','Tofu','Edamame','Smoked mackerel']],
  ['Dairy & alternatives',['Greek yoghurt','Milk of choice','Plant milk','Feta','Cheese']],
  ['Grains & pantry',['Rolled oats','Wholegrain bread','Brown rice','Quinoa','Chopped tomatoes','Vegetable stock','Mixed beans','Red lentils','Chickpeas','Cannellini beans','Buckwheat flakes','Gluten-free wrap','Rye bread','Oatcakes','Coconut milk','Tamari','Nut butter','Hummus','Olive oil','Herbs','Spices']],
  ['Nuts & seeds',['Brazil nuts','Pumpkin seeds','Mixed nuts','Sunflower seeds','Mixed seeds','Chia seeds']],
];
const ITEMCAT=(()=>{const m={};CATLIST.forEach(([c,items])=>items.forEach(it=>m[it]=c));return m;})();
function shoppingGrouped(){
  if(!state.plan)return[];
  const counts={};
  state.plan.days.forEach(d=>['b','l','d','s'].forEach(k=>{const meal=MEALS.find(x=>x.name===d[k].name);if(meal)meal.items.forEach(it=>{counts[it]=(counts[it]||0)+1;});}));
  const cats={};Object.keys(counts).forEach(it=>{const c=ITEMCAT[it]||'Other';(cats[c]=cats[c]||[]).push(it);});
  const order=CATLIST.map(x=>x[0]).concat(['Other']);
  return order.filter(c=>cats[c]).map(c=>[c,cats[c].sort().map(it=>({item:it,count:counts[it]}))]);
}

function cycleMark(name){

function filterFoods(){
  const groups=document.querySelectorAll('.food-group');if(!groups.length)return;
  const q=(state.food.q||'').toLowerCase().trim();const tier=state.food.tier||'all';
  const searching=!!q||tier!=='all';let shown=0;
  groups.forEach(g=>{
    const rows=g.querySelectorAll('.food-row');let any=false;

const SYM_MAP={mcas:{},eds:{headache:'head',gi:'gut',skin:'skinfrag'},pots:{palp:'heart',presyncope:'bp',nausea:'gut'}};
const TRIG_MAP={mcas:{},eds:{overexertion:'exercise'},pots:{exertion:'exercise',missedmed:'misseddose'}};
const RELIEF_MAP={mcas:{},eds:{meds:'painmeds'},pots:{cooling:'cool',meds:'rescue'}};
function detectApp(o){
  if(!o||typeof o!=='object'||!o.profile) return null;
  if(o.profile.has&&typeof o.profile.has==='object') return 'trinity';
  if(Array.isArray(o.jointEvents)||Array.isArray(o.beighton)||(o.pt&&typeof o.pt==='object')) return 'eds';
  if((o.salt&&typeof o.salt==='object')||(o.compression&&typeof o.compression==='object')) return 'pots';
  if(o.foodmarks||Array.isArray(o.customfoods)||Array.isArray(o.reintros)||'med' in o.profile||o.diet) return 'mcas';
  return null;
}
function singleAppData(k){try{const r=localStorage.getItem(CONDINFO[k].ls);if(!r)return null;const o=JSON.parse(r);return (o&&Array.isArray(o.checkins))?o:null;}catch(e){return null;}}

function importFrom(kind,o){
  try{
    if(!o){toast('Nothing to import');return;}

    setTimeout(()=>maybeOfferImport(false),400);
  }catch(e){try{console.error(e);}catch(_){}toast('Sorry, that import did not work. Your data is unchanged.');}
}
function mergeFrom(kind,o){
  const p=state.profile, op=o.profile||{};
  p.has[kind]=true;
  ['name','yob','sex'].forEach(k=>{if(!p[k]&&op[k])p[k]=op[k];});
  if(kind==='eds'&&op.subtype&&!p.edsType) p.edsType=op.subtype;
  if(kind==='pots'&&op.subtype&&!p.potsType) p.potsType=op.subtype;
  if(kind==='mcas'&&op.pregnancy) p.pregnancy=true;
  const skip=/^(MCAS|POTS|EDS|hEDS)/i;
  (op.conditions||[]).forEach(c=>{if(typeof c==='string'&&!skip.test(c)&&!p.conditions.includes(c))p.conditions.push(c);});
  /* meds: single-med MastMate profile, or EDS/POTS med lists */
  const idMap={};
  if(kind==='mcas'){
    const nm=(op.med==='Other (please specify)'&&op.medOther)?op.medOther:op.med;
    if(nm&&nm!=='None yet / as-needed only'){
      let m=state.meds.find(x=>x.name===nm);
      if(!m){m={id:'mcas_med',name:nm,dose:op.dose?(op.dose+' '+(op.unit||'mg')):'',time:op.when==='bedtime'?'morning and evening':'morning'};state.meds.push(m);}
      idMap.__single=m.id;
    }
  }else{
    (o.meds||[]).forEach(m=>{if(!m||!m.name)return;let ex=state.meds.find(x=>x.name.toLowerCase()===String(m.name).toLowerCase());
      if(!ex){ex={id:kind+'_'+m.id,name:m.name,dose:m.dose||'',time:m.time||''};state.meds.push(ex);}idMap[m.id]=ex.id;});
  }
  (o.doses||[]).forEach(d=>{
    if(!d||!d.date)return;
    let rec=state.doses.find(x=>x.date===d.date);
    if(!rec){rec={date:d.date,taken:{},correct:{empty:false,gap:false,supps:false}};state.doses.push(rec);}
    if(kind==='mcas'){if(idMap.__single&&d.taken===true)rec.taken[idMap.__single]=true;if(d.correct)Object.keys(d.correct).forEach(k=>{if(d.correct[k])rec.correct[k]=true;});}
    else if(d.taken&&typeof d.taken==='object'){Object.keys(d.taken).forEach(id=>{if(d.taken[id]&&idMap[id])rec.taken[idMap[id]]=true;});}
  });
  state.doses.sort((a,b)=>a.date<b.date?-1:1);
  /* check-ins: merge by date, mapping symptom, trigger and relief names */
  const mapArr=(arr,map)=>[...new Set((arr||[]).map(x=>map[x]||x))];
  let n=0;
  (o.checkins||[]).forEach(c=>{
    if(!c||!c.date)return; const date=String(c.date).slice(0,10);
    let ex=state.checkins.find(x=>x.date===date);
    if(!ex){ex={date,sev:{},energy:null,mood:null,weight:'',triggers:[],foods:[],relief:[],dur:'',notes:'',restHR:null,standHR:null,restBP:'',standBP:''};state.checkins.push(ex);}
    n++;
    Object.entries(c.sev||{}).forEach(([k,v])=>{const kk=SYM_MAP[kind][k]||k;ex.sev[kk]=Math.max(ex.sev[kk]||0,Number(v)||0);});
    ex.triggers=[...new Set([...(ex.triggers||[]),...mapArr(c.triggers,TRIG_MAP[kind])])];
    ex.relief=[...new Set([...(ex.relief||[]),...mapArr(c.relief,RELIEF_MAP[kind])])];
    if(kind==='mcas') ex.foods=[...new Set([...(ex.foods||[]),...(c.foods||[])])];
    if(c.energy!=null&&ex.energy==null) ex.energy=kind==='eds'?Math.max(0,Math.min(4,Number(c.energy)-1)):Number(c.energy);
    if(c.mood!=null&&ex.mood==null) ex.mood=Number(c.mood);
    if(c.weight&&!ex.weight) ex.weight=c.weight;
    if(c.dur&&!ex.dur) ex.dur=c.dur;
    if(c.notes) ex.notes=ex.notes?(ex.notes.includes(c.notes)?ex.notes:ex.notes+' · '+c.notes):c.notes;
    if(kind==='pots'){['restHR','standHR'].forEach(k=>{if(c[k]!=null&&c[k]!==''&&ex[k]==null)ex[k]=Number(c[k]);});['restBP','standBP'].forEach(k=>{if(c[k]&&!ex[k])ex[k]=c[k];});}
  });
  state.checkins.sort((a,b)=>a.date<b.date?-1:1);
  /* daily logs */
  const water=o.water||{};
  Object.keys(water).forEach(d=>{const ml=kind==='mcas'?Number(water[d])*250:Number(water[d]);if(ml>0)state.water[d]=Math.max(state.water[d]||0,ml);});
  if(kind==='pots'){
    Object.keys(o.salt||{}).forEach(d=>{const g=Number(o.salt[d]);if(g>0)state.salt[d]=Math.max(state.salt[d]||0,g);});
    Object.keys(o.compression||{}).forEach(d=>{if(o.compression[d])state.compression[d]=true;});
    const st=o.settings||{}; if(st.fluidTarget)state.settings.fluidTarget=st.fluidTarget; if(st.saltTarget!=null)state.settings.saltTarget=st.saltTarget;
  }
  if(kind==='eds'){
    Object.keys(o.pt||{}).forEach(d=>{if(o.pt[d])state.pt[d]=true;});
    Object.keys(o.brace||{}).forEach(d=>{if(o.brace[d])state.brace[d]=true;});
    (o.jointEvents||[]).forEach(e=>{if(e&&e.date&&!state.jointEvents.some(x=>x.date===e.date&&x.joint===e.joint&&x.type===e.type))state.jointEvents.push({date:e.date,joint:e.joint||'Other',type:e.type||'subluxation',selfReduced:!!e.selfReduced,notes:e.notes||''});});
    (o.beighton||[]).forEach(b=>{if(b&&b.date&&typeof b.score==='number'&&!state.beighton.some(x=>x.date===b.date&&x.score===b.score))state.beighton.push(b);});
  }
  (o.customNotes||[]).forEach(t=>{if(typeof t==='string'&&!state.customNotes.includes(t))state.customNotes.push(t);});
  if(o.visitNotes&&!state.visitNotes) state.visitNotes=o.visitNotes;
  if(kind==='mcas'){
    (o.dosechanges||[]).forEach(d=>{if(d&&d.date&&!state.dosechanges.some(x=>x.date===d.date&&x.dose===d.dose))state.dosechanges.push(d);});
    (o.labs||[]).forEach(l=>{if(!l||!l.date)return;const ex=state.labs.find(x=>x.date===l.date);if(ex)Object.assign(ex,Object.assign({},l,ex));else state.labs.push(l);});
    state.labs.sort((a,b)=>a.date<b.date?-1:1);
    Object.assign(state.foodmarks,o.foodmarks||{});
    (o.customfoods||[]).forEach(f=>{if(!state.customfoods.includes(f))state.customfoods.push(f);});
    (o.periods||[]).forEach(d=>{if(!state.periods.includes(d))state.periods.push(d);});state.periods.sort();
    (o.reintros||[]).forEach(t=>state.reintros.push(t));
    if(o.reintro&&!state.reintro) state.reintro=o.reintro;
    (o.experiments||[]).forEach(x=>state.experiments.push(x));
    if(o.experiment&&!state.experiment) state.experiment=o.experiment;
    if(o.labtest&&!state.labtest) state.labtest=o.labtest;
    if(o.plan&&!state.plan){state.plan=o.plan;state.shopping=o.shopping||{};}
    if(o.diet) Object.assign(state.diet,o.diet);
    if(o.settings&&o.settings.cycleOn) state.settings.cycleOn=true;
  }
  if(!state.imported.includes(kind)) state.imported.push(kind);
  state.onboarded=true;
  return n;
}

  document.body.appendChild(t);setTimeout(()=>t.remove(),1800);}

function onboard(){
  const slides=[
    {e:'💜',h:'Welcome to TrinityMate',b:'One private companion for MCAS, EDS and POTS, whether you have one, two or all three. Everything you log stays on this device. No account, no cloud, works offline.'},
    {e:'🔗',h:'It sees the overlap',b:'Your conditions share triggers and set each other off. One daily check-in tracks them side by side, and TrinityMate shows which triggers hit more than one, something a single-condition app never could.'},
    {e:'🩺',h:'One page for every doctor',b:'Reactions, joint events and standing heart rate on one printable summary, so every specialist sees the whole picture. Not medical advice, just a calm place to notice patterns.'}
  ];
  let i=0;
  const draw=()=>{
    const sl=slides[i];
    const m=document.getElementById('modal');
    m.innerHTML=`<div style="text-align:center;padding:8px 4px">
      <div style="font-size:46px;margin-bottom:6px">${sl.e}</div>
      <h2 style="font-size:24px">${sl.h}</h2>
      <p class="lede" style="font-size:15px;margin:10px auto 4px;max-width:320px">${sl.b}</p>
      <div style="display:flex;justify-content:center;gap:7px;margin:18px 0 6px">${slides.map((_,j)=>`<div style="width:8px;height:8px;border-radius:99px;background:${j===i?'var(--teal)':'var(--line)'}"></div>`).join('')}</div>
      ${i<slides.length-1
        ? `<button class="btn btn-primary btn-block" style="margin-bottom:8px" onclick="_onbNext()">Next</button><button class="btn btn-ghost btn-block" onclick="_onbDone();openCondPicker(true)">Skip</button>`
        : `<button class="btn btn-primary btn-block" style="margin-bottom:8px" onclick="_onbDone();openCondPicker(true)">Choose my conditions</button><button class="btn btn-ghost btn-block" onclick="_onbDone();loadDemo(true)">Explore with example data first</button>`}
    </div>`;
    document.getElementById('modalbg').classList.add('on');
  };
  window._onbNext=()=>{i++;draw();};
  window._onbDone=()=>{state.onboarded=true;save();document.getElementById('modalbg').classList.remove('on');};
  draw();
}

function exportCSV(){
  const rows=[['date','type','field','value']];
  (state.checkins||[]).forEach(c=>{
    Object.entries(c.sev||{}).forEach(([k,v])=>{if(v)rows.push([c.date,'symptom',k,v]);});
    (c.foods||[]).forEach(f=>rows.push([c.date,'food',f.replace(/^cf:/,''),1]));
    (c.triggers||[]).forEach(t=>rows.push([c.date,'trigger',t,1]));
    (c.relief||[]).forEach(r=>rows.push([c.date,'relief',r,1]));
    if(c.dur)rows.push([c.date,'flare-duration','dur',c.dur]);
    if(c.energy!=null)rows.push([c.date,'energy','energy',c.energy]);
    if(c.mood!=null)rows.push([c.date,'mood','mood',c.mood]);
    ['restHR','standHR','restBP','standBP'].forEach(k=>{if(c[k]!=null&&c[k]!=='')rows.push([c.date,'vitals',k,c[k]]);});
    if(hrJump(c)!=null)rows.push([c.date,'vitals','standingRise',hrJump(c)]);
    if(c.notes)rows.push([c.date,'note','notes',c.notes]);
  });
  (state.jointEvents||[]).forEach(e=>rows.push([e.date,'joint-event',jointLabel(e),e.type+(e.selfReduced?' (self-reduced)':'')]));
  (state.beighton||[]).forEach(b=>rows.push([b.date,'beighton','score',b.score]));
  Object.entries(state.water||{}).forEach(([d,v])=>{if(v)rows.push([d,'fluids','ml',v]);});
  Object.entries(state.salt||{}).forEach(([d,v])=>{if(v)rows.push([d,'salt','g',v]);});
  ['compression','pt','brace'].forEach(k=>Object.entries(state[k]||{}).forEach(([d,v])=>{if(v)rows.push([d,'care',k,1]);}));
  (state.doses||[]).forEach(d=>state.meds.forEach(m=>rows.push([d.date,'med',m.name,d.taken&&d.taken[m.id]?'taken':'not ticked'])));
  (state.labs||[]).forEach(l=>Object.entries(l).forEach(([k,v])=>{if(k!=='date'&&v)rows.push([l.date,'lab',k,v]);}));
  Object.entries(state.foodmarks||{}).forEach(([k,v])=>rows.push(['','food-mark',k,v]));
  (state.periods||[]).forEach(d=>rows.push([d,'period','start',1]));
  (state.reintros||[]).forEach(t=>rows.push([t.ended||t.started,'reintro',t.food,t.verdict]));
  const csv=rows.map(r=>r.map(x=>{const s=String(x);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}).join(',')).join('\n');
  const blob=new Blob([csv],{type:'text/csv'});const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download='trinitymate-data-'+today()+'.csv';document.body.appendChild(a);a.click();a.remove();
  toast('CSV exported');
}

/* theme */
const _darkMQ=window.matchMedia?window.matchMedia('(prefers-color-scheme: dark)'):null;
function applyTheme(){
  const t=(state.settings&&state.settings.theme)||'auto';
  const dark=t==='dark'||(t==='auto'&&_darkMQ&&_darkMQ.matches);
  document.documentElement.dataset.theme=dark?'dark':'light';
  const mt=document.querySelector('meta[name="theme-color"]'); if(mt)mt.setAttribute('content',dark?'#15121C':'#5E4B7E');
}
function setTheme(k){state.settings.theme=k;save();applyTheme();render();}
try{_darkMQ&&_darkMQ.addEventListener&&_darkMQ.addEventListener('change',applyTheme);}catch(e){}
/* printing always uses the light theme so text stays readable on paper */
window.addEventListener('beforeprint',()=>{document.documentElement.dataset.theme='light';});
window.addEventListener('afterprint',applyTheme);
applyTheme();
try{let _lt;new MutationObserver(()=>{clearTimeout(_lt);_lt=setTimeout(labelInputs,60);}).observe(document.body,{childList:true,subtree:true});}catch(e){}

/* init */
try{
  if(!state.onboarded && !condCount() && !(state.checkins&&state.checkins.length)){
    const found=CONDKEYS.some(k=>{const o=singleAppData(k);return o&&o.checkins.length;});
    if(found) maybeOfferImport(false); else onboard();
  }else if(state.onboarded){ maybeOfferImport(false); }
}catch(e){try{console.error(e);}catch(_){}}
render();
maybeNotify();
document.addEventListener('visibilitychange',()=>{if(!document.hidden)maybeNotify();});
